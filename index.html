.pwab>b{display:block;font-size:1.05rem;color:var(--navy);margin-bottom:2px}
.pwab>span{display:block;font-size:.9rem;line-height:1.45;color:var(--mut)}

.pwab .btn{min-height:52px;font-size:1rem}

/* Alamat server dari config.js (bila diisi) dipakai otomatis di semua HP. Tanpa garis miring ganda di dalam skrip. */
(function(){try{var u=String(window.CLR_SERVER||'').replace(/^\s+|\s+$/g,'');if(/^https:[/][/]script\.google(usercontent)?\.com[/]/.test(u)){localStorage.setItem('clr_exec',u);document.documentElement.className+=' clr-pre';}}catch(e){}})();
</script>
<title>CLR Peneleh - Telemarketing v9</title>
<script>
/* Tema dipasang sebelum halaman tampil agar tidak berkedip. Pilihan: terang (bawaan) / gelap / auto (mengikuti HP). */
(function(){try{var p=localStorage.getItem('clr_theme');var d=p==='gelap'||(p==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0a1030':'#f3f5ff');}catch(e){}})();
</script>
<style>
/* ============================================================
   TEMA v9 - iOS "liquid glass": pink lembut + biru, aksen merah & kuning
   PC (lebar 1024px ke atas): dashboard dengan menu di kiri. HP: otomatis tampilan HP (menu bawah).
   ============================================================ */
:root{
  --pink:#ff5d9e;--pink-d:#d9246f;--pink-l:#ffd9ea;--pink-x:#fff0f7;
  --blue:#2a5fe6;--blue-d:#1b45c0;--blue-l:#dbe6ff;--sky:#edf2ff;
  --navy:#17275f;--ink:#1c2750;--mut:#5b678f;--line:rgba(72,94,174,.2);
  --red:#e93a53;--yel:#ffbf1f;--grn:#12a15c;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.78);--edge:rgba(255,255,255,.92);
  --shadow:0 12px 32px rgba(58,78,168,.15);--shadow2:0 5px 16px rgba(58,78,168,.13);
  --ease:cubic-bezier(.2,.8,.2,1);
  --ff:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--ff);color:var(--ink);line-height:1.4;overflow-x:hidden;
  background:#f3f5ff;
  background-image:radial-gradient(1100px 700px at -8% -10%,#ffcfe3 0%,rgba(255,207,227,0) 62%),radial-gradient(1000px 720px at 108% 2%,#c3d8ff 0%,rgba(195,216,255,0) 60%),radial-gradient(900px 700px at 55% 118%,#ffdcec 0%,rgba(255,220,236,0) 66%);
  background-attachment:fixed}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;opacity:.8;animation:fl 22s ease-in-out infinite;will-change:transform}
.b1{width:420px;height:420px;top:-120px;right:-120px;background:radial-gradient(circle at 40% 40%,rgba(255,105,170,.5),rgba(255,105,170,0) 68%)}
.b2{width:460px;height:460px;bottom:-160px;left:-140px;background:radial-gradient(circle at 50% 50%,rgba(70,120,255,.42),rgba(70,120,255,0) 68%);animation-delay:-9s}
.b3{width:300px;height:300px;top:38%;left:46%;background:radial-gradient(circle at 50% 50%,rgba(255,196,60,.3),rgba(255,196,60,0) 68%);animation-delay:-15s}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-36px) scale(1.06)}}
#app{position:relative;z-index:1}

/* ---------- kerangka: HP ---------- */
.shell{max-width:1000px;margin:0 auto;padding:10px 14px 132px;padding:calc(10px + env(safe-area-inset-top)) 14px 132px}
.side{display:none}
.mainc{min-width:0}
.top{display:flex;align-items:center;padding:9px 10px;margin-bottom:14px;color:var(--navy);border-radius:26px;background:rgba(255,255,255,.62);border:1px solid var(--edge);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.95)}
.logo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#000;border:2px solid #fff;flex:none;margin-right:12px;box-shadow:0 4px 12px rgba(58,78,168,.25)}
.logo.big{width:116px;height:116px;border-width:4px;margin:0 auto 10px;display:block;box-shadow:0 10px 28px rgba(58,78,168,.3)}
.who{flex:1;min-width:0}
.top .t1{font-weight:800;font-size:.98rem;line-height:1.15}
.top .t2{font-size:.84rem;color:var(--mut);font-weight:600}
.ptitle{display:none}
.menu-btn{flex:none;margin-left:10px;min-width:96px;height:52px;padding:0 16px;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--blue-d);font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow2),inset 0 1px 0 #fff;transition:transform .18s var(--ease),box-shadow .25s}
.menu-btn:active{transform:scale(.95)}

/* ---------- tombol: kaca ---------- */
.btn{--b1:#5a8dff;--b2:#2a5fe6;--bs:42,95,230;position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;padding:12px 18px;border:1px solid rgba(255,255,255,.6);border-radius:18px;font-family:inherit;font-weight:800;font-size:1rem;line-height:1.2;cursor:pointer;text-decoration:none;text-align:center;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.36) 0%,rgba(255,255,255,0) 54%),linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:0 8px 20px rgba(var(--bs),.28),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(0,20,100,.16);
  transition:transform .2s var(--ease),box-shadow .25s,filter .25s}
.btn:hover{box-shadow:0 12px 26px rgba(var(--bs),.38),0 0 0 4px rgba(var(--bs),.12),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,20,100,.16)}
.btn:active{transform:scale(.965);filter:brightness(.97);box-shadow:0 3px 8px rgba(var(--bs),.25),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:focus-visible,.bi:focus-visible,.si:focus-visible,.tile:focus-visible,.dchip:focus-visible,.menu-btn:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.btn.block{width:100%}
.btn small{display:block;font-weight:600;font-size:.9rem;opacity:.95}
.btn-pink{--b1:#ff6fae;--b2:#dc2a74;--bs:220,42,116}
.btn-red{--b1:#ff6a7c;--b2:#e0263f;--bs:224,38,63}
.btn-yel{--b1:#ffd75e;--b2:#ffb700;--bs:255,183,0;color:#4a3200;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn-blue{--b1:#5a8dff;--b2:#2a5fe6;--bs:42,95,230}
.btn-call{--b1:#46d68a;--b2:#14a25c;--bs:20,162,92}
.btn-sol{--b1:#ffd75e;--b2:#ffb700;--bs:255,183,0;color:#4a3200;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn-nosol{--b1:#a1aed3;--b2:#6877a8;--bs:104,119,168}
.btn-fu{--b1:#4a78f5;--b2:#1c2f96;--bs:28,47,150}
.btn-mail{--b1:#9a8dff;--b2:#5a49e0;--bs:90,73,224}
.btn-light{color:var(--blue-d);background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.4));border:1px solid rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 6px 16px rgba(58,78,168,.12),inset 0 1px 0 #fff}
.btn-light:hover{box-shadow:0 10px 22px rgba(58,78,168,.2),0 0 0 4px rgba(42,95,230,.1),inset 0 1px 0 #fff}
.btn-del{color:var(--red);background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,235,238,.5));border:1px solid rgba(255,190,200,.9);box-shadow:0 5px 14px rgba(233,58,83,.12),inset 0 1px 0 #fff}
.btn.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pink),0 10px 24px rgba(var(--bs),.35)}
.btn.dim{opacity:.45}
.btn[disabled]{opacity:.5;pointer-events:none}
summary.btn{list-style:none}summary.btn::-webkit-details-marker{display:none}
.sol{padding:12px;border-radius:20px;background:rgba(255,255,255,.55);border:1px solid var(--edge)}
.sol-t{font-weight:800;margin-bottom:10px;color:var(--navy)}
.sol.fu{border:2px solid transparent}.sol.fu.due{border-color:var(--red);background:rgba(255,235,238,.8)}
.sol-t.big{font-size:1.2rem;text-align:center;margin:10px 0 14px}
.sol.em .btn,.sol.em .two{margin-top:10px}.sol.em{border:2px solid transparent}.sol.em.wait{border-color:var(--yel);background:rgba(255,246,214,.8)}.sol.em.ok{border-color:var(--blue);background:rgba(232,240,255,.9)}.sol.em.bad{border-color:var(--red);background:rgba(255,235,238,.8)}
.tgrp{grid-column:1/-1;color:var(--mut);font-weight:800;font-size:.86rem;letter-spacing:.02em;text-transform:uppercase;margin:6px 4px 0}
.warnbox{padding:10px 14px;border-radius:16px;background:rgba(255,244,214,.85);border:1px solid rgba(255,191,31,.7);font-weight:700;font-size:.9rem;color:#5a3d00}
.okbox{padding:10px 14px;border-radius:16px;background:rgba(232,240,255,.9);border:1px solid rgba(42,95,230,.4);font-weight:700;font-size:.9rem;color:var(--blue-d)}
.infobox{padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--edge);font-weight:700;font-size:.9rem;color:var(--navy)}
.empre{margin-top:10px;max-height:46vh;overflow:auto;padding:12px;border-radius:16px;background:rgba(255,255,255,.7);font-size:.9rem;line-height:1.5;word-break:break-word}
.kv{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}.kv span{color:var(--mut);flex:none;margin-right:12px}.kv b{text-align:right;word-break:break-word}

/* ---------- isian ---------- */
.inp{display:block;width:100%;min-height:56px;padding:12px 16px;border:1.5px solid var(--line);border-radius:18px;font-family:inherit;font-size:1rem;color:var(--ink);background:rgba(255,255,255,.8);box-shadow:inset 0 1px 3px rgba(40,60,140,.07);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s,background .2s}
select.inp{-webkit-appearance:menulist;appearance:auto}
.inp:focus{border-color:var(--pink);background:#fff;box-shadow:0 0 0 4px rgba(255,93,158,.2)}
textarea.inp{min-height:96px}
.lb{display:block;font-weight:800;margin:14px 0 6px;color:var(--navy)}
.chk{display:flex;align-items:center;margin-top:12px;font-weight:700;cursor:pointer}
.chk input{margin-right:12px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--pink);flex:none}

/* ---------- kartu & panel: kaca ---------- */
.panel,.card{background:var(--glass);border:1px solid var(--edge);border-radius:26px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.95);padding:16px;color:var(--ink);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.card{display:grid;grid-gap:12px;gap:12px}
.card h3{margin:0;font-size:1.22rem;line-height:1.25;color:var(--navy)}
.addr{margin:0;color:var(--mut);font-size:.95rem}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:800;font-size:.82rem;background:rgba(255,255,255,.8);border:1px solid var(--edge);color:var(--navy);box-shadow:0 2px 6px rgba(58,78,168,.08)}
.bd-red{background:linear-gradient(180deg,#ff6a7c,#e0263f);color:#fff;border-color:rgba(255,255,255,.5)}
.bd-yel{background:linear-gradient(180deg,#ffd75e,#ffb700);color:#4a3200;border-color:rgba(255,255,255,.5)}
.bd-blue{background:linear-gradient(180deg,#5a8dff,#2a5fe6);color:#fff;border-color:rgba(255,255,255,.5)}
.no{font-weight:700;color:var(--mut);font-size:.9rem}
.c-top{display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-gap:14px;gap:14px;grid-template-columns:1fr}
.stack{display:grid;grid-gap:12px;gap:12px}
.ttl{color:var(--navy);font-size:1.25rem;font-weight:800;margin:10px 4px 12px;letter-spacing:-.01em}
.ttl2{color:var(--mut);font-weight:700;font-size:.95rem;margin:-6px 4px 12px}
.sub{color:var(--mut);font-size:.95rem;margin:4px 0 12px}
.err{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,227,230,.9);color:#9b1226;font-weight:700}
.notice{margin:6px 2px 12px;color:var(--mut);font-weight:700;text-align:center}
.note>div{display:grid;grid-gap:4px;gap:4px;margin-top:10px}
.srv{margin:14px 0 0;text-align:center;font-size:.85rem;font-weight:700;color:var(--mut)}
.srv.ok{color:#0b6fd0}.srv.bad{color:#b3122a}.srv.warn{color:#9a5b00}
.ver{margin:6px 0 0;text-align:center;font-size:.75rem;color:#8a97c2}

/* ---------- ringkasan angka (juga dipakai sebagai filter) ---------- */
.tiles{display:grid;grid-gap:10px;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.tile{position:relative;display:block;width:100%;border:1px solid var(--edge);border-radius:22px;padding:12px 14px 16px;text-align:left;background:var(--glass2);color:var(--ink);font-family:inherit;box-shadow:var(--shadow2),inset 0 1px 0 #fff;min-height:88px;overflow:hidden;transition:transform .2s var(--ease),box-shadow .25s}
.tile::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:5px;border-radius:5px 5px 0 0;background:var(--ac,#aebbe6)}
button.tile{cursor:pointer}
button.tile:active{transform:scale(.96)}
.tile b{display:block;font-size:1.85rem;line-height:1.05;color:var(--navy)}
.tile span{font-size:.84rem;font-weight:800;color:var(--mut)}
.tile.on{box-shadow:0 0 0 3px var(--ac,var(--pink)),0 10px 26px rgba(58,78,168,.22)}
.t-red{--ac:#e93a53}.t-yel{--ac:#ffbf1f}.t-blue{--ac:#2a5fe6}.t-gray{--ac:#aebbe6}
.tile.wide{grid-column:1/-1;min-height:58px;display:flex;align-items:center;justify-content:space-between}
.tile.wide b{font-size:1.3rem}
.tchips{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tchips::-webkit-scrollbar{display:none}
.tile.mini{flex:none;width:auto;min-height:48px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px}
.tile.mini::after{display:none}
.tile.mini b{font-size:1.02rem;margin:0}
.tile.mini span{font-size:.82rem;white-space:nowrap}
.tile.mini.on{box-shadow:0 0 0 3px var(--ac,var(--pink)),0 6px 16px rgba(58,78,168,.2)}
.bar{height:14px;border-radius:99px;background:rgba(80,100,180,.14);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--blue));border-radius:99px;transition:width .5s}
.pills{display:flex;flex-wrap:wrap;margin:-4px}
.pills>*{margin:4px}

/* ---------- filter tanggal, laporan harian ---------- */
.dfp{margin-bottom:12px}
.dft{font-weight:800;color:var(--navy);margin-bottom:10px}
.dchips{display:flex;flex-wrap:wrap;margin:-4px}
.dchips>*{margin:4px}
.dchip{min-height:46px;padding:8px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--blue-d);font-family:inherit;font-weight:800;font-size:.93rem;line-height:1.1;cursor:pointer;box-shadow:var(--shadow2),inset 0 1px 0 #fff;transition:transform .18s var(--ease),box-shadow .25s,background .25s}
.dchip:hover{box-shadow:0 8px 18px rgba(58,78,168,.18),0 0 0 4px rgba(42,95,230,.1),inset 0 1px 0 #fff}
.dchip:active{transform:scale(.95)}
.dchip.on{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 55%),linear-gradient(180deg,#ff6fae,#dc2a74);border-color:rgba(255,255,255,.7);color:#fff;box-shadow:0 8px 18px rgba(220,42,116,.32),inset 0 1px 0 rgba(255,255,255,.6)}
.dfinfo{margin-top:10px}
.rdate{display:grid;grid-template-columns:58px 1fr 58px;grid-gap:8px;gap:8px;align-items:center}
.rdate .btn{padding:0;font-size:1.7rem}
.rk{width:100%;border-collapse:collapse;font-size:.8rem}
.rk th,.rk td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}
.rk th{color:var(--mut);font-size:.62rem;line-height:1.1}
.rk td:first-child,.rk th:first-child{text-align:left;font-weight:800}
.rk tr.tot td{font-weight:800;background:rgba(42,95,230,.08)}
.rkw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rk tr.pick{cursor:pointer}.rk tr.pick:active{background:var(--sky)}
.rk td small{display:block;font-weight:600;font-size:.58rem;color:var(--mut);line-height:1.2;white-space:nowrap}
.rk td small.off{color:var(--red)}
.rk2 th,.rk2 td{padding-left:1px;padding-right:1px}
.rlink{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:800;color:var(--blue-d);text-align:left;text-decoration:underline;cursor:pointer}
.rlink:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.rk th.l,.rk td.l{text-align:left}
.rk td.cell{cursor:pointer;font-weight:800;transition:filter .2s}
.rk td.cell:hover{filter:brightness(.95)}
.rk td.cg{background:rgba(42,95,230,.16);color:var(--blue-d)}.rk td.cy{background:rgba(255,191,31,.3);color:#6a4700}.rk td.cr{background:rgba(233,58,83,.15);color:#a3152a}.rk td.c0{color:#9aa6cf;font-weight:600}
.rk td.tot2{font-weight:800;background:rgba(255,93,158,.12);color:var(--pink-d)}
.rkc th,.rkc td{padding:7px 1px;font-size:.76rem}.rkc th{font-size:.58rem}
.det{margin:6px 0 0;font-size:.88rem;color:var(--mut);line-height:1.45;word-break:break-word}

/* ---------- target harian, progres, grafik ---------- */
.tgp{margin-bottom:12px}
.tgh{display:flex;align-items:baseline;justify-content:space-between}
.tgh b{font-size:2.3rem;line-height:1;color:var(--navy);letter-spacing:-.02em}
.tgh b small{font-size:1rem;font-weight:800;color:var(--mut);letter-spacing:0}
.tgh span{font-size:1.2rem;font-weight:800;color:var(--navy)}
.tgm{font-weight:800;color:var(--navy)}
.tgl{font-size:.88rem;font-weight:700;color:var(--mut);margin-top:4px}
.pbar{height:14px;border-radius:999px;background:rgba(80,100,180,.14);overflow:hidden;margin:8px 0 6px;box-shadow:inset 0 1px 2px rgba(40,60,140,.1)}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--blue);transform-origin:left;animation:growx .9s var(--ease) both}
.pbar.ok>i{background:linear-gradient(90deg,#2a5fe6,#5b8cff)}.pbar.mid>i{background:linear-gradient(90deg,#ffb700,#ffd75e)}.pbar.low>i{background:linear-gradient(90deg,#e0263f,#ff6a7c)}.pbar.own>i{background:linear-gradient(90deg,var(--pink),var(--blue))}
.cap{padding:10px 0;border-bottom:1px solid var(--line)}.cap:first-child{padding-top:0}.cap:last-child{border-bottom:0;padding-bottom:0}
.capn{font-size:1rem}.capv{font-weight:800;color:var(--navy);font-size:.95rem;white-space:nowrap}
.hrow{display:grid;grid-template-columns:44px 1fr 28px;grid-gap:8px;gap:8px;align-items:center;margin:5px 0;font-weight:800;font-size:.8rem;color:var(--navy)}
.hrow b{text-align:right}
.hbar{position:relative;height:16px;border-radius:8px;background:rgba(80,100,180,.12);overflow:hidden}

.hero>*{position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-l{min-width:0;flex:1}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:rgba(80,100,180,.16);stroke-width:3.6}

.scs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sc{display:inline-flex;align-items:center;padding:6px 12px 6px 10px;border-radius:999px;font-weight:700;font-size:.84rem;background:rgba(255,255,255,.75);border:1px solid var(--edge);color:var(--navy);box-shadow:0 2px 8px rgba(58,78,168,.08)}
.sc::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--ac);margin-right:7px;flex:none}
.sc b{margin-left:5px;font-size:.95rem}
.sc-blue{--ac:var(--blue)}.sc-yel{--ac:var(--yel)}.sc-red{--ac:var(--red)}.sc-pink{--ac:var(--pink)}
.wkh{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-weight:800;color:var(--navy);font-size:.9rem}
.wkh .rlink{font-size:.85rem}
.spark{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:6px;gap:6px;height:128px;margin-top:8px}
.sp{display:flex;flex-direction:column;align-items:center;min-width:0;border:0;background:none;padding:0;font-family:inherit;cursor:pointer}
.sp b{font-size:.74rem;color:var(--navy);margin-bottom:3px;line-height:1}
.sp .col{position:relative;flex:1;width:100%;min-height:0}
.sp .col i{position:absolute;left:50%;bottom:0;width:78%;max-width:36px;margin-left:-39%;border-radius:10px 10px 6px 6px;min-height:4px;transform-origin:bottom;animation:growy .85s var(--ease) both}
.sp .col i.cg{background:linear-gradient(180deg,#ff6fae,#2a5fe6)}.sp .col i.cy{background:linear-gradient(180deg,#ffd75e,#ffb700)}.sp .col i.cr{background:linear-gradient(180deg,#ff6a7c,#e0263f)}.sp .col i.c0{background:rgba(80,100,180,.18);height:4px}
.sp.today .col i{box-shadow:0 0 0 2px #fff,0 0 14px rgba(255,93,158,.55)}
.sp span{font-size:.66rem;font-weight:700;color:var(--mut);margin-top:4px;white-space:nowrap;line-height:1.15;text-align:center}
.sp.today span{color:var(--pink-d)}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
.skel{min-height:72px;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.9),rgba(255,255,255,.4));background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.todayslot{margin-top:2px}
.todayslot .tgm{font-size:.9rem}

/* ---------- rapor 7 hari ---------- */
.seg{display:grid;grid-gap:6px;gap:6px;grid-template-columns:1fr 1fr;margin:10px 0 14px;padding:6px;border-radius:26px;background:rgba(255,255,255,.4);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow2),inset 0 1px 0 #fff}

.seg .btn.btn-light{background:transparent;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;color:var(--mut)}
.seg .btn.btn-blue{--b1:#ff6fae;--b2:#dc2a74;--bs:220,42,116;box-shadow:0 8px 18px rgba(220,42,116,.3),inset 0 1px 0 rgba(255,255,255,.6)}

.seg.seg4{grid-template-columns:1fr 1fr}
.seg.seg4 .btn{padding:8px 6px;font-size:.92rem;line-height:1.15;min-height:56px}
.rk7{min-width:100%}
.rk7 th,.rk7 td{padding:7px 2px;font-size:.8rem}
.rk7 th{font-size:.62rem;line-height:1.15;vertical-align:bottom}
.rk7 th small{display:block;font-weight:600;font-size:.56rem;color:var(--mut);white-space:nowrap}
.rk7 th.tdy{color:var(--pink-d)}
.rk7 th.tt{min-width:48px}
.rk7 th:first-child,.rk7 td:first-child{position:sticky;left:0;z-index:1;background:#f8f9ff;min-width:64px;max-width:96px;padding-left:6px;word-break:break-word;box-shadow:2px 0 0 var(--line)}
.rk7 tr.tot td:first-child{background:#e9efff}
.rk7 td.l small{display:block;font-weight:700;font-size:.56rem;color:var(--red)}
.rcard{margin-bottom:14px}
.rcards{display:block}
.rc-n{font-size:1.15rem;font-weight:800;color:var(--navy);line-height:1.15;word-break:break-word}
.rc-id{display:block;font-size:.72rem;font-weight:700;color:var(--mut);margin-top:2px}
.rc-t{text-align:right;line-height:1;flex:none;margin-left:10px}.rc-t b{display:block;font-size:2rem;color:var(--blue-d);letter-spacing:-.02em}.rc-t small{display:block;margin-top:2px;font-size:.7rem;font-weight:700;color:var(--mut)}
.rstats{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:8px;gap:8px;margin:12px 0 6px}
.rstats>div{background:rgba(255,255,255,.7);border:1px solid var(--edge);border-radius:16px;padding:8px 4px;text-align:center}
.rstats b{display:block;font-size:1.15rem;color:var(--navy);line-height:1.1}
.rstats small{display:block;font-size:.66rem;font-weight:700;color:var(--mut);line-height:1.15;margin-top:3px}
.wrow{display:block;width:100%;min-height:44px;margin:2px 0;padding:4px 6px;border:0;border-radius:14px;background:none;font-family:inherit;color:var(--navy);text-align:left;cursor:pointer;transition:background .2s}
.wrow:hover{background:rgba(255,255,255,.6)}
.wrow:active{background:var(--sky)}
.wrow:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
div.wrow{cursor:default}
.wg{display:grid;grid-template-columns:78px 1fr 34px;grid-gap:8px;gap:8px;align-items:center;min-height:36px}
.wl{font-weight:800;font-size:.84rem;line-height:1.1}
.wl small{display:block;font-weight:600;font-size:.64rem;color:var(--mut)}
.wg b{text-align:right;font-size:.98rem}
.wbar{display:block;height:16px;border-radius:8px;background:rgba(80,100,180,.12);overflow:hidden}
.wbar>i{display:block;height:100%;border-radius:8px;background:var(--line);transform-origin:left;animation:growx .9s var(--ease) both}
.wbar>i.cg{background:linear-gradient(90deg,#ff6fae,#2a5fe6)}.wbar>i.cy{background:linear-gradient(90deg,#ffb700,#ffd75e)}.wbar>i.cr{background:linear-gradient(90deg,#e0263f,#ff6a7c)}

/* ---------- navigasi bawah (HP) ---------- */
.bnav{position:fixed;left:12px;right:12px;bottom:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:space-around;max-width:620px;margin:0 auto;padding:6px;border-radius:30px;background:rgba(255,255,255,.66);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:0 14px 36px rgba(58,78,168,.25),inset 0 1px 0 #fff}
.bi{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;padding:4px 2px;border:0;background:none;font-family:inherit;font-size:.72rem;font-weight:800;line-height:1.15;color:var(--mut);border-radius:22px;cursor:pointer;text-align:center;transition:transform .2s var(--ease),background .25s,color .25s,box-shadow .25s}

.bi.on i{transform:translateY(-1px) scale(1.1)}

/* ---------- masuk ---------- */
.login{min-height:100vh;min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:14px}
.login .panel{width:100%;max-width:440px;padding:26px 22px;background:rgba(255,255,255,.62);animation:pop .5s var(--ease) both}

/* ---------- lain-lain ---------- */
.grp{margin-bottom:14px}
.row-it{display:flex;align-items:flex-start;padding:12px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid var(--edge);margin-top:10px}

#loader{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(230,236,255,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#loader.show{display:flex}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,93,158,.22);border-top-color:var(--pink);animation:sp .8s linear infinite}
.ltx{margin-top:14px;color:var(--navy);font-weight:800}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:0;right:0;bottom:100px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:100;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.tst{width:100%;max-width:460px;padding:14px 18px;border-radius:22px;font-weight:800;font-size:1rem;text-align:center;color:#fff;border:1px solid rgba(255,255,255,.55);box-shadow:0 14px 34px rgba(30,50,140,.35),inset 0 1px 0 rgba(255,255,255,.5);animation:dn .32s var(--ease)}
.tst.ok{background:linear-gradient(180deg,rgba(90,141,255,.96),rgba(42,95,230,.96))}.tst.err{background:linear-gradient(180deg,rgba(255,106,124,.97),rgba(224,38,63,.97))}
@keyframes dn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#errbar{position:fixed;left:10px;right:10px;top:10px;z-index:120;background:#9b1226;color:#fff;padding:12px 14px;border-radius:16px;font-weight:700;font-size:.85rem;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* gerak halaman (tanpa mengganggu saat data dimuat ulang) */

   ============================================================ */
#notif{position:fixed;left:0;right:0;top:0;z-index:110;display:flex;justify-content:center;padding:10px 10px 0;padding-top:calc(10px + env(safe-area-inset-top));pointer-events:none}
.ntf{position:relative;pointer-events:auto;width:100%;max-width:430px;display:flex;align-items:flex-start;gap:12px;padding:13px 14px 16px;border-radius:26px;cursor:pointer;overflow:hidden;color:#14204a;background:rgba(246,248,255,.76);border:1px solid rgba(255,255,255,.88);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);box-shadow:0 20px 46px rgba(30,45,120,.32),0 2px 6px rgba(30,45,120,.12),inset 0 1px 0 rgba(255,255,255,.95);opacity:0;transform:translateY(-150%)}
.ntf.in{animation:ntfin .75s cubic-bezier(.2,.9,.25,1.12) forwards}
.ntf.out{animation:ntfout .45s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes ntfin{0%{transform:translateY(-150%) scale(.94);opacity:0}50%{opacity:1}78%{transform:translateY(5px) scale(1.01)}100%{transform:none;opacity:1}}
@keyframes ntfout{from{transform:none;opacity:1}to{transform:translateY(-150%) scale(.96);opacity:0}}
.ntf-i{flex:none;width:42px;height:42px;border-radius:11px;object-fit:cover;background:#000;box-shadow:0 2px 8px rgba(30,45,120,.28)}
.ntf-b{flex:1;min-width:0}
.ntf-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ntf-h b{min-width:0;font-size:.9rem;font-weight:800;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntf-h span{flex:none;font-size:.74rem;font-weight:600;color:#6a77a0}
.ntf-t{margin-top:2px;font-size:.9rem;line-height:1.38;font-weight:500;color:#1c2750;word-break:break-word}
.ntf-p{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--pink),var(--blue));transform-origin:left;animation:ntfp 15s linear forwards;opacity:.9}
@keyframes ntfp{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(min-width:1024px){#notif{justify-content:flex-end;padding-right:24px}}
html[data-theme="dark"] .ntf{color:#eef3ff;background:rgba(26,34,84,.74);border-color:rgba(160,190,255,.3);box-shadow:0 20px 46px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
html[data-theme="dark"] .ntf-t{color:#dfe8ff}
html[data-theme="dark"] .ntf-h span{color:#9fb2e8}

.emrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;margin-top:6px}
.emnum{flex:none}

.emnum small{display:block;margin-top:3px;font-size:.78rem;font-weight:700;color:var(--mut)}

/* ============================================================
   v12: KACA ULTRA-BENING (liquid glass jernih) + ANIMASI MIKRO
   Kaca: lebih transparan, blur halus (16px), tepi berkilau tipis (specular), teks tetap tegas, terang dan gelap.
   Gerak: hanya transform + opacity (digarap kartu grafis). Bila perangkat diatur "kurangi gerakan", gerak dimatikan.
   ============================================================ */
:root{
  --glass:rgba(255,255,255,.34);--glass2:rgba(255,255,255,.5);--mut:#475482;
  --gblur:16px;--gsat:1.8;
  --shadow:0 14px 34px rgba(58,78,168,.13),0 2px 6px rgba(58,78,168,.06);
  --shadow2:0 6px 18px rgba(58,78,168,.11);
  --spring:cubic-bezier(.3,1.9,.5,1);
  --rim:linear-gradient(140deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.28) 26%,rgba(255,255,255,.05) 52%,rgba(255,140,196,.36) 80%,rgba(255,255,255,.88) 100%)}
.blob{opacity:.62}

/* ---------- permukaan kaca: terang ---------- */
.panel,.card,.top,.seg,.thm{position:relative}
.panel,.card{background:linear-gradient(155deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.1) 46%,rgba(255,255,255,.24) 100%),var(--glass);border-color:rgba(255,255,255,.42);
  -webkit-backdrop-filter:blur(var(--gblur)) saturate(var(--gsat));backdrop-filter:blur(var(--gblur)) saturate(var(--gsat));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(110,130,220,.12)}
.top{background:linear-gradient(155deg,rgba(255,255,255,.52),rgba(255,255,255,.14) 60%,rgba(255,255,255,.26)),rgba(255,255,255,.3);border-color:rgba(255,255,255,.45);
  -webkit-backdrop-filter:blur(18px) saturate(var(--gsat));backdrop-filter:blur(18px) saturate(var(--gsat));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.panel.hero{background:linear-gradient(115deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 38%),linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,222,240,.38) 52%,rgba(210,226,255,.44))}
.tile{background:linear-gradient(160deg,rgba(255,255,255,.58),rgba(255,255,255,.18)),var(--glass2);border-color:rgba(255,255,255,.5);box-shadow:var(--shadow2),inset 0 1px 0 rgba(255,255,255,.9)}
.seg{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.45)}
.thm{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.45)}
.bnav{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.12) 60%),rgba(255,255,255,.36);border-color:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9)}
.mbox{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8)}
.btn-light{background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.3));border-color:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(12px) saturate(1.7);backdrop-filter:blur(12px) saturate(1.7)}
.dchip{background:rgba(255,255,255,.44);border-color:rgba(255,255,255,.7)}
.menu-btn{background:rgba(255,255,255,.4)}
.row-it{background:rgba(255,255,255,.5)}
@media(min-width:1024px){
  .side{background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 50%,rgba(255,255,255,.24)),rgba(255,255,255,.3);border-color:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8)}
}

/* tepi berkilau tipis (specular): cincin gradien 1px di dalam tepi, terang di kiri-atas dan kanan-bawah */
@supports ((-webkit-mask-composite:xor) or (mask-composite:exclude)){
  .panel:not(.hero)::before,.card::before,.top::before,.tile::before,.seg::before,.thm::before,.bnav::before,.hero::after{
    content:'';position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--rim);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
}

/* HP/tablet kecil: ringan. Kartu daftar tanpa blur (tepi berkilau dibuat dari bayangan dalam, jauh lebih murah), kontrol kecil tanpa blur, panel blur lebih kecil */
@media(max-width:1023px){
  .panel{-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6)}
  .card{background:linear-gradient(155deg,rgba(255,255,255,.74),rgba(255,255,255,.5) 55%,rgba(255,255,255,.62)),rgba(255,255,255,.2);-webkit-backdrop-filter:none;backdrop-filter:none;
    box-shadow:0 8px 22px rgba(58,78,168,.11),inset 0 1px 0 rgba(255,255,255,.95),inset 1px 0 0 rgba(255,255,255,.6),inset -1px 0 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(120,140,220,.16)}
  .card::before{display:none}
  .btn-light,.dchip,.menu-btn,.seg,.dx{-webkit-backdrop-filter:none;backdrop-filter:none}
  .btn-light{background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.52))}
  .dchip,.menu-btn{background:rgba(255,255,255,.62)}
}

/* ---------- permukaan kaca: gelap (biru + merah) ---------- */
html[data-theme="dark"]{
  --glass:rgba(22,34,98,.3);--glass2:rgba(30,46,122,.4);--edge:rgba(150,180,255,.3);
  --shadow:0 18px 44px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);--shadow2:0 6px 18px rgba(0,0,0,.34);
  --rim:linear-gradient(140deg,rgba(150,195,255,.95) 0%,rgba(120,160,255,.2) 26%,rgba(255,255,255,.05) 52%,rgba(255,85,112,.3) 78%,rgba(255,130,150,.88) 100%)}
html[data-theme="dark"] .blob{opacity:.8}
html[data-theme="dark"] .top,html[data-theme="dark"] .panel,html[data-theme="dark"] .side,html[data-theme="dark"] .seg,html[data-theme="dark"] .thm{
  background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.02) 46%,rgba(255,255,255,.05)),var(--glass);border-color:rgba(150,180,255,.22);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.28)}
html[data-theme="dark"] .card{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 46%,rgba(255,255,255,.04)),rgba(20,32,92,.5);border-color:rgba(150,180,255,.22);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.28)}
html[data-theme="dark"] .bnav{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 60%),rgba(14,22,64,.5);border-color:rgba(150,180,255,.26);
  box-shadow:0 14px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22)}
html[data-theme="dark"] .side{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 50%,rgba(255,255,255,.05)),rgba(12,20,60,.42)}
html[data-theme="dark"] .panel.hero{background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 40%),linear-gradient(135deg,rgba(58,88,208,.5),rgba(150,30,66,.34) 54%,rgba(44,96,230,.44))}
html[data-theme="dark"] .tile{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 55%),var(--glass2);border-color:rgba(150,180,255,.26);box-shadow:var(--shadow2),inset 0 1px 0 rgba(255,255,255,.2)}
html[data-theme="dark"] .mbox{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 30%),rgba(14,22,64,.88)}
html[data-theme="dark"] .login .panel{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 46%),rgba(18,30,88,.4)}

/* ---------- tombol kenyal ala tetesan air: tekan = gepeng cepat, lepas = membal elastis ---------- */
.btn,.dx,.rmx{transition:transform .5s var(--spring),box-shadow .25s,filter .25s}
.menu-btn,.fpill,button.tile{transition:transform .5s var(--spring),box-shadow .25s}
.dchip{transition:transform .5s var(--spring),box-shadow .25s,background .25s}
.thb,.bi{transition:transform .5s var(--spring),background .25s,color .25s,box-shadow .25s}
.btn:active,.dx:active,.rmx:active,.menu-btn:active,.fpill:active,button.tile:active,.dchip:active,.thb:active,.bi:active{transition-duration:.09s;transition-timing-function:ease-out}
.btn:active{transform:scale(1.03,.92)}
button.tile:active{transform:scale(1.03,.93)}
.menu-btn:active,.dchip:active,.fpill:active,.thb:active{transform:scale(1.06,.9)}
.bi:active{transform:scale(1.08,.88)}
.dx:active,.rmx:active{transform:scale(1.08,.9)}
.bi i{transition:transform .5s var(--spring)}
.bi:active i{transform:translateY(-3px) scale(1.2)}
@media(min-width:1024px){
  .si{transition:transform .5s var(--spring),background .25s,box-shadow .25s,color .25s}
  .si:active{transform:scale(1.02,.93);transition-duration:.09s;transition-timing-function:ease-out}
}

/* ---------- maskot melayang pelan, lencana memantul, baris menguap ---------- */
.mascot{display:inline-block;animation:floaty 3.8s ease-in-out infinite;transform-origin:50% 80%}
.rmi{animation:floaty 3.6s ease-in-out infinite}
.logo.big{animation:floaty2 4.6s ease-in-out infinite}
.badge.pop{animation:badgepop .6s var(--spring) backwards}
.tile b.bump,.tgh b.bump{animation:bump .55s var(--spring);transform-origin:0 70%}
.tgm.pop{animation:badgepop .7s var(--spring) backwards;transform-origin:0 50%}
.vanish{animation:vanish .42s cubic-bezier(.4,0,.8,.4) forwards;pointer-events:none;transform-origin:50% 80%}
.card.rise{animation:rise .42s var(--ease) backwards}
.cards.enter .card[style*="--i"]{animation:cardin .55s var(--spring) backwards;animation-delay:calc(var(--i,0)*45ms)}
.cards.lock{pointer-events:none}
.tst{animation:dn .42s var(--ease)}
@keyframes dn{0%{opacity:0;transform:translateY(18px) scale(.94)}60%{opacity:1;transform:translateY(-4px) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes badgepop{0%{opacity:0;transform:scale(.35)}50%{opacity:1;transform:scale(1.2)}72%{transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.32)}58%{transform:scale(.93)}80%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes vanish{0%{opacity:1;transform:none}30%{opacity:.9;transform:translateY(-3px) scale(1.025)}100%{opacity:0;transform:translateY(-26px) scale(.88)}}
@keyframes cardin{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel,.card,.top,.bnav,.seg,.tile,.mbox,.side{background:rgba(255,255,255,.92)}
}
@media(prefers-reduced-motion:reduce){
  .mascot,.rmi,.logo.big,.badge.pop,.tile b.bump,.tgh b.bump,.tgm.pop,.cards.enter .card,.card.rise,.tst{animation:none!important}
  .vanish{animation:none!important;opacity:0}
  .btn:active,button.tile:active,.menu-btn:active,.dchip:active,.fpill:active,.thb:active,.bi:active,.dx:active,.rmx:active,.si:active{transform:scale(.98)}
  .bi:active i{transform:none}
}

/* v12b: rapikan pengingat sore (angka tebal di dalam kalimat tetap sebaris, hanya judul yang turun baris) dan jarak ikon Muat Ulang */
.rmt b{display:inline;margin:0;font-size:inherit;color:inherit}
.rmt>b:first-child{display:block;margin-bottom:2px;font-size:1rem;color:var(--navy)}
.rtx{margin-left:.4em}
</style>

<!-- PENGAMAN: skrip kecil ini sengaja terpisah dan ditulis ES5 supaya tetap jalan walau skrip utama di bawah gagal dibaca
     (misalnya file Index.html tersalin tidak lengkap). Tugasnya: memunculkan pesan merah yang jelas, bukan layar kosong. -->
<script>
(function(){
  var VER = 'v9', mulai = false, PENANDA = 'CLR-AWAL-v9';
  function bar(){ return document.getElementById('errbar'); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function show(html){ var b = bar(); if (!b) return; b.innerHTML = html; b.hidden = false; }
  var b0 = bar(); if (b0) b0.onclick = function(){ b0.hidden = true; };
  /* dipanggil oleh skrip utama begitu ia berhasil dibaca dan mulai berjalan */
  window.__clrMulai = function(){ mulai = true; };
  window.addEventListener('error', function(e){
    var m = (e && e.message) || 'tidak diketahui', ln = (e && e.lineno) ? ' (baris ' + e.lineno + ')' : '', cuplik = '';
    try {
      var ss = document.getElementsByTagName('script'), n = e && e.lineno;
      for (var i = 0; n && i < ss.length; i++) { var L = (ss[i].text || '').split('\n')[n - 1]; if (L) cuplik += '<br><span style="font-weight:400;font-size:.75rem">blok ' + i + ': ' + esc(L.slice(0, 110)) + '</span>'; }
      if (n && e.colno) cuplik += '<br><span style="font-weight:400;font-size:.75rem">kolom ' + e.colno + '</span>';
    } catch (x) {}
    show('<b>Terjadi kesalahan:</b> ' + esc(m) + ln + cuplik + '<br>Mohon foto layar ini dan kirim ke admin (' + VER + '). Ketuk untuk menutup.');
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason;
    show('<b>Terjadi kesalahan:</b> ' + esc((r && r.message) || r || 'tidak diketahui') + '<br>Mohon foto layar ini dan kirim ke admin (' + VER + '). Ketuk untuk menutup.');
  });
  setTimeout(function(){
    if (mulai || !document.getElementById('boot')) return;
    var p = document.getElementById('boot');
    if (p) p.innerHTML = '<p style="font-size:1.15rem">\u26a0 Aplikasi tidak bisa dimulai.</p><p style="font-weight:600;font-size:.95rem">File aplikasi tidak terbuka dengan lengkap atau browser terlalu lama. Unduh ulang file ini lalu buka dengan Google Chrome terbaru.</p>';
  }, 4000);
})();
</script>

/* ===================== v12: POSISI SCROLL TETAP + ANIMASI MIKRO =====================
   Semua gerak hanya memakai transform dan opacity (digarap kartu grafis, tidak memicu tata letak ulang berulang).
   Bila HP/PC diatur "kurangi gerakan", animasi dimatikan lewat CSS dan penantian animasi dilewati (reduceMotion). */
function reduceMotion(){ try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }
const KEEP_SEL = '.rpanel,.dbody,.rkw,.empre,.cards,#dres,#view';
/* jalankan fn (perubahan layar), lalu kembalikan posisi scroll halaman dan semua kontainer yang tadinya sudah tergulir */
function keepScroll(fn){
  const se = document.scrollingElement || document.documentElement, x = se.scrollLeft, y = se.scrollTop, boxes = [];
  document.querySelectorAll(KEEP_SEL).forEach(el => { if (el.scrollTop > 0 || el.scrollLeft > 0) boxes.push([el, el.scrollTop, el.scrollLeft]); });
  const back = () => {
    if (se.scrollTop !== y || se.scrollLeft !== x) window.scrollTo(x, y);
    boxes.forEach(b => { if (b[0].isConnected) { if (b[0].scrollTop !== b[1]) b[0].scrollTop = b[1]; if (b[0].scrollLeft !== b[2]) b[0].scrollLeft = b[2]; } });
  };
  let out;
  try { out = fn(); } finally { back(); }
  requestAnimationFrame(back); /* sekali lagi setelah tata letak selesai (peramban kadang menyesuaikan posisi sendiri) */
  return out;
}
/* elemen "menguap" (naik pelan + memudar) lalu selesai; tanpa animasi bila gerakan dikurangi */
function vanish(el){
  return new Promise(res => {
    if (!el || reduceMotion()) { res(); return; }
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    el.classList.add('vanish'); el.addEventListener('animationend', fin, { once: true }); setTimeout(fin, 500);
  });
}
function rectsOf(sel, keyOf){
  const m = new Map(), vh = window.innerHeight || 800;
  document.querySelectorAll(sel).forEach(el => { const r = el.getBoundingClientRect(); if (r.bottom > -vh && r.top < vh * 2) m.set(keyOf(el), { t: r.top, l: r.left }); });
  return m;
}
/* pasangan [elemen, posisi lama]: elemen meluncur dari posisi lama ke posisi barunya hanya dengan transform (teknik FLIP) */
function glide(pairs){
  if (reduceMotion() || !pairs.length) return;
  const mv = [];
  pairs.forEach(p => { const r = p[0].getBoundingClientRect(), dx = p[1].l - r.left, dy = p[1].t - r.top; if (Math.abs(dx) > 1 || Math.abs(dy) > 1) mv.push([p[0], dx, dy]); });
  if (!mv.length) return;
  mv.forEach(m => { m[0].style.transition = 'none'; m[0].style.transform = 'translate(' + m[1] + 'px,' + m[2] + 'px)'; });
  void document.body.offsetWidth; /* satu kali hitung tata letak untuk semuanya */
  requestAnimationFrame(() => mv.forEach(m => {
    const el = m[0]; el.style.transition = 'transform .4s cubic-bezier(.22,1.12,.36,1)'; el.style.transform = '';
    setTimeout(() => { el.style.transition = ''; }, 480);
  }));
}
/* kartu pertama muncul berurutan sekali saja ketika daftar dibuka */

async function checkServer(){

    const d = await call('ping', {}, { silent: true, quiet: true });

    else if (d && d.ver && d.ver !== VER) set('warn', '\u25cf Terhubung ke server, TETAPI versi berbeda: Code.gs di Google ' + d.ver + ', file ini ' + VER + '. Ganti Code.gs dengan yang terbaru lalu Terapkan \u2192 Kelola penerapan \u2192 Versi baru.');
    else set('ok', LOCAL ? '\u25cf Mode mandiri: data tersimpan di perangkat ini' : '\u25cf Terhubung ke server');

}

  if (f.k === '7d') return { from: isoPlus(-6), to: todayIso() };

function dfIn(r){ const g = dfRange(); if (!g) return true; const a = r.act || ''; return !!a && (!g.from || a >= g.from) && (!g.to || a <= g.to); }

/* ===================== TARGET TELEPON HARIAN (v7) =====================

function tgInfo(n, g){
  g = g || 50; const pct = Math.round(n * 100 / g);
  return { pct: pct, left: Math.max(0, g - n), cls: n >= g ? 'ok' : pct >= 60 ? 'mid' : 'low', w: Math.min(100, pct) };
}
function pbar(n, g, own){

function todayFix(){
  if (S.today && S.today.date !== todayIso()) S.today = { date: todayIso(), n: 0, ok: 0, tm: 0, tdh: 0, st: {}, partial: false }; /* lewat tengah malam saat aplikasi masih terbuka */
}
function todayBump(nama, st){
  if (!S.today || S.user.role === 'admin') return;
  todayFix();
  const T = S.today, k = String(nama).trim().toLowerCase(), prev = T.st[k] || '';
  const cnt = (v, d) => { if (v === ST[2]) T.ok += d; else if (v === ST[1]) T.tm += d; else if (v === ST[0]) T.tdh += d; };
  if (prev) { cnt(prev, -1); T.n--; delete T.st[k]; }
  if (st) { cnt(st, 1); T.n++; T.st[k] = st; }
}
function ringHtml(pct, max, now){

/* batang 7 hari (kiri = terlama, kanan = hari ini). per[] terbaru dulu, sama urutannya dengan days[] dari server */
function sparkBars(days, per, g, to){

  let h = '';

    const d = days[i], n = per[i], dt = dateOfIso(d.date), lab = dt ? HRS[dt.getDay()] + ' ' + dt.getDate() : d.date, ht = n ? Math.max(8, Math.round(n * 100 / mx)) : 0;
    h += `<button class="sp ${i === 0 ? 'today' : ''}" data-act="tab" data-t="${to}" aria-label="${esc((i === 0 ? 'Hari ini' : lab) + ': ' + n + ' data')}"><b>${n}</b><span class="col"><i class="${cls(n)}" style="height:${ht}%"></i></span><span>${dt ? esc(HRS[dt.getDay()]) + '<br>' + dt.getDate() : esc(d.date)}</span></button>`;
  }

}

async function centerDrop(r){
  const box = $('#cards'), before = rectsOf('#cards .card', c => +c.id.slice(2));
  if (box) box.classList.add('lock'); /* sampai selesai bergerak, kartu tidak bisa diketuk (nomor baris sedang bergeser) */
  try {
    await vanish(document.getElementById('c-' + r.row));
    keepScroll(() => { centerDropLocal(r); renderTiles(); renderCards(); });
    const pairs = [], fresh = [];
    document.querySelectorAll('#cards .card').forEach(c => { const nr = +c.id.slice(2), from = before.get(nr >= r.row ? nr + 1 : nr); if (from) pairs.push([c, from]); else fresh.push(c); });
    glide(pairs); fresh.forEach(c => c.classList.add('rise'));
  } finally { const b2 = $('#cards'); if (b2) b2.classList.remove('lock'); } /* apa pun yang terjadi, daftar tidak boleh tetap terkunci */
}

    if ('status' in fields) todayBump(r.nama, r.status); /* hitungan Target Hari Ini mengikuti aturan server: satu perusahaan sekali per hari */

async function approveIds(ids){
  const per = (S.em && S.em.d && S.em.d.batch) || 5;
  const flagged = ids.some(id => { const c = document.querySelector('.emchk[data-id="' + id + '"]'); return c && c.dataset.flag === '1'; });
  const lamp = S.em && S.em.d && S.em.d.compro && S.em.d.compro.ok ? ' (dengan lampiran Company Profile)' : ' (tanpa lampiran)';
  const msg = 'Kirim ' + ids.length + ' email penawaran' + lamp + ' sekarang? Email yang sudah terkirim tidak bisa ditarik kembali.' + (flagged ? '\n\nAda tanda \u26a0 pada sebagian pengajuan ini. Pastikan sudah Anda periksa.' : '');
  if (!await ask('Setujui & kirim?', msg, 'Ya, kirim')) return;
  const hasil = [], peri = [], pesan = $('.ltx');
  let fatal = '';
  busy(1);
  try {
    for (let i = 0; i < ids.length; i += per) {
      if (pesan) pesan.textContent = 'Mengirim email ' + Math.min(i + per, ids.length) + ' dari ' + ids.length + '\u2026';
      const d = await call('emailApprove', { ids: ids.slice(i, i + per) }, { silent: true });
      d.hasil.forEach(h => hasil.push(h));
      (d.peringatan || []).forEach(w => { if (peri.indexOf(w) < 0) peri.push(w); });
    }
  } catch (e) { fatal = e.message; }
  busy(-1); if (pesan) pesan.textContent = 'Sabar\u2026';
  const okN = hasil.filter(h => h.ok).length, bad = hasil.filter(h => !h.ok), warn = hasil.filter(h => h.warn);
  const list = bad.map(h => `<div class="warnbox" style="margin-bottom:8px">${esc(h.nama || 'Pengajuan')}${h.email ? ' (' + esc(h.email) + ')' : ''}: ${esc(h.msg)}</div>`).join('')
    + warn.map(h => `<div class="warnbox" style="margin-bottom:8px">${esc(h.nama || '')}: ${esc(h.warn)}</div>`).join('')
    + peri.map(w => `<div class="warnbox" style="margin-bottom:8px">\u26a0 ${esc(w)}</div>`).join('')
    + (fatal ? `<div class="warnbox" style="margin-bottom:8px">\u26a0 ${esc(fatal)}</div>` : '');
  const vc = {}; hasil.filter(h => h.ok && h.via).forEach(h => { vc[h.via] = (vc[h.via] || 0) + 1; });
  const viaTxt = Object.keys(vc).some(k => k !== 'Akun utama') ? '<p class="sub">Dikirim lewat: ' + Object.keys(vc).map(k => esc(k) + ' (' + vc[k] + ')').join(', ') + '</p>' : '';
  const toSet = fatal && /Company Profile|Drive/i.test(fatal) ? '<button class="btn btn-blue block" data-act="emtoset">\u2699 Buka Pengaturan Email</button>' : '';
  modal(`<h2>${okN ? '\u2714 ' + okN + ' email terkirim' : 'Belum ada email yang terkirim'}</h2>
    ${viaTxt}${bad.length ? '<p class="sub"><b>' + bad.length + ' belum terkirim:</b></p>' : ''}${list}
    <div class="stack" style="margin-top:14px">${toSet}<button class="btn btn-pink block" data-act="emdone">Tutup</button></div>`);
}

function hh2(h){ return (h < 10 ? '0' : '') + h; }
function minOf(hm){ const m = /^(\d{1,2}):(\d{2})/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : -1; }
function paceText(x){
  const a = minOf(x.c1), b = minOf(x.c2);
  if (x.dihubungi < 2 || a < 0 || b - a < 30) return '';
  return ' \u00b7 rata-rata ' + (Math.round(x.dihubungi / ((b - a) / 60) * 10) / 10).toString().replace('.', ',') + ' data/jam';
}

function hourChart(jam, ok){
  let a = -1, b = -1, mx = 0;
  jam.forEach((n, h) => { if (n) { if (a < 0) a = h; b = h; if (n > mx) mx = n; } });
  if (a < 0) return '';
  a = Math.min(a, 8); b = Math.max(b, 16); /* jam kerja biasa (08 sampai 16) selalu tampil */
  let rows = '';
  for (let h = a; h <= b; h++) rows += `<div class="hrow"><span>${hh2(h)}:00</span><div class="hbar"><i style="width:${Math.round(jam[h] * 100 / mx)}%"></i><u style="width:${Math.round(ok[h] * 100 / mx)}%"></u></div><b>${jam[h]}</b></div>`;
  return `<div class="panel" style="margin-bottom:14px"><div class="dft">\u23f1 Telepon per Jam</div>${rows}<p class="addr" style="margin:8px 0 0">Angka = prospek yang pertama kali dihubungi pada jam itu. Warna tua = yang terhubung.</p></div>`;
}

  const R = rpState(), c = R.c, host = $('#rbody'); if (!host || !c) return;

  T.forEach(x => { sum[x.sheet] = 0; work[x.sheet] = 0; hit[x.sheet] = 0; });
  c.days.forEach(d => {
    let tot = 0;
    T.forEach(x => { const n = d.per[x.sheet] ? d.per[x.sheet].n : 0; tot += n; sum[x.sheet] += n; if (n > 0) work[x.sheet]++; if (n >= g) hit[x.sheet]++; });

    <div class="panel rkw" style="padding:12px 8px;margin-bottom:14px"><table class="rk rkc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table>
      <p class="addr" style="margin:10px 6px 0">Angka = prospek yang dihubungi hari itu. \ud83d\udfe6 tercapai (${g} atau lebih) \u00b7 \ud83d\udfe8 ${Math.ceil(g * 0.6)} atau lebih \u00b7 \ud83d\udfe5 di bawah itu \u00b7 abu-abu = tidak ada telepon. Rata-rata dan Capai dihitung dari hari yang ada teleponnya. Ketuk angka untuk melihat rinciannya.</p></div>

  const ei = $('#re'); if (ei) ei.onchange = e => { if (!dateOfIso(e.target.value)) return; R.end = e.target.value; rcGo(); };

function dupActions(){

function renderDups(){

  if (!d.groupCount) { $('#dres').innerHTML = `<div class="panel" style="text-align:center;font-weight:800">\u2714 Tidak ada data ganda dari ${d.scanned} data.</div>`; return; }

    `<div class="panel">${dupActions()}</div>`;

function countChk(){ const n = document.querySelectorAll('.dchk:checked').length; document.querySelectorAll('.dcnt').forEach(c => { c.textContent = n; }); }

ACT.dauto = () => { document.querySelectorAll('.grp').forEach(g => g.querySelectorAll('.dchk').forEach((c, i) => { c.checked = i > 0; })); countChk(); };
ACT.ddel = async () => {
  const items = [...document.querySelectorAll('.dchk:checked')].map(c => ({ sheet: c.dataset.sheet, row: +c.dataset.row, nama: c.dataset.nama }));
  if (!items.length) { toast('Belum ada yang dicentang', 'err'); return; }
  if (!await ask('Hapus ' + items.length + ' baris?', 'Baris dihapus permanen dari Google Sheets dan nomor urut dirapikan. Tidak bisa dibatalkan.', 'Ya, Hapus', true)) return;
  const boxes = [...document.querySelectorAll('.dchk:checked')];
  try {
    const r = await call('deleteRows', { items: items });
    toast('\u2714 ' + r.deleted + ' baris dihapus');
    await dupsDrop(items, boxes, r.deleted);
  } catch (e) { toast(e.message, 'err'); }
};
/* v12: cermin lokal hasil hapus: baris yang hilang dibuang, nomor baris di bawahnya turun, kelompok yang tinggal 1 ikut hilang, angka ringkasan dihitung ulang */
function dupsDropLocal(items, st){
  const d = S.dupData; if (!d) return;
  const gone = {}; items.forEach(it => { (gone[it.sheet] = gone[it.sheet] || []).push(it.row); });
  const hit = (sh, n) => (gone[sh] || []).indexOf(n) >= 0, below = (sh, n) => (gone[sh] || []).filter(x => x < n).length;
  const full = d.groupCount === d.groups.length; /* semua kelompok sedang tampil (tidak terpotong 300) */
  let lost = 0, vanished = 0;
  d.groups = d.groups.filter(g => {
    const keeperGone = g.items.length && hit(g.items[0].sheet, g.items[0].row);
    const left = g.items.filter(it => !hit(it.sheet, it.row));
    lost += (g.items.length - 1) - (left.length >= 2 ? left.length - 1 : 0);
    left.forEach(it => { it.chk = st[it.sheet + '|' + it.row]; it.row -= below(it.sheet, it.row); });
    if (keeperGone && left.length) left[0].chk = false; /* yang dipertahankan sebelumnya sudah dihapus: yang pertama sekarang jadi penggantinya */
    g.items = left;
    if (left.length < 2) { vanished++; return false; }
    return true;
  });
  d.scanned = Math.max(0, d.scanned - items.length);
  d.groupCount = full ? d.groups.length : Math.max(d.groups.length, d.groupCount - vanished);
  d.extra = full ? d.groups.reduce((a, g) => a + g.items.length - 1, 0) : Math.max(0, d.extra - lost);
}
function dupSig(d){ return JSON.stringify([d.scanned, d.groupCount, d.extra, d.groups.map(g => g.items.map(it => it.sheet + '|' + it.row + '|' + it.nama).sort().join(';')).sort()]); }
/* posisi tiap kelompok ganda (dikenali dari baris-baris di dalamnya) sebelum dan sesudah, supaya kelompok di bawahnya meluncur naik dengan halus */
function dupRects(){
  const m = new Map(), vh = window.innerHeight || 800;
  document.querySelectorAll('#dres .grp').forEach(p => { const r = p.getBoundingClientRect(); if (r.bottom > -vh && r.top < vh * 2) p.querySelectorAll('.dchk').forEach(c => m.set(c.dataset.sheet + '|' + c.dataset.row, { t: r.top, l: r.left })); });
  return m;
}
async function dupsDrop(items, boxes, deleted){
  const seq = S._dupSeq = (S._dupSeq || 0) + 1;
  if (deleted !== items.length) { /* sebagian baris dilewati server (sudah bergeser): periksa ulang penuh, posisi scroll dijaga */
    const d = await call('dups', { scope: S.dupScope });
    keepScroll(() => { S.dupData = d; renderDups(); });
    return;
  }
  const st = {}; document.querySelectorAll('.dchk').forEach(c => { st[c.dataset.sheet + '|' + c.dataset.row] = c.checked; });
  const before = dupRects(), gone = {};
  items.forEach(it => { (gone[it.sheet] = gone[it.sheet] || []).push(it.row); });
  Object.keys(gone).forEach(k => gone[k].sort((a, b) => a - b));
  await Promise.all(boxes.map(c => vanish(c.closest('.row-it'))));
  keepScroll(() => { dupsDropLocal(items, st); renderDups(); });
  const pairs = [];
  document.querySelectorAll('#dres .grp').forEach(p => {
    const c = p.querySelector('.dchk'); if (!c) return;
    let o = +c.dataset.row; (gone[c.dataset.sheet] || []).forEach(x => { if (x <= o) o++; }); /* nomor baris sebelum penghapusan */
    const from = before.get(c.dataset.sheet + '|' + o); if (from) pairs.push([p, from]);
  });
  glide(pairs);
  /* cocokkan dengan server di latar belakang (tanpa layar loading); tampilan hanya diganti bila hasilnya berbeda */
  call('dups', { scope: S.dupScope }, { silent: true, quiet: true }).then(d => {
    if (seq !== S._dupSeq || !S.dupData || dupSig(d) === dupSig(S.dupData)) return;
    if (!$('#dres')) { S.dupData = d; return; }
    const now = {}; document.querySelectorAll('.dchk').forEach(c => { now[c.dataset.sheet + '|' + c.dataset.row + '|' + c.dataset.nama] = c.checked; });
    d.groups.forEach(g => g.items.forEach(it => { const k = it.sheet + '|' + it.row + '|' + it.nama; if (k in now) it.chk = now[k]; }));
    keepScroll(() => { S.dupData = d; renderDups(); });
  }).catch(() => {});
}

/* ===================== ADMIN PEMANTAU: CEK SOLAR =====================
   Mencari perusahaan di seluruh database (semua sheet telemarketing + Database Center yang belum dibagikan) dan menunjukkan
   apakah perusahaan itu memakai solar. Server hanya mengirim kolom aman: catatan, PIC, email, dan follow up TIDAK pernah dikirim. */
function ckState(){ if (!S.ck) S.ck = { q: '', solar: '', tele: '', d: null, rows: [], err: '', seq: 0 }; return S.ck; }
const CK_SC = { ya: ['bd-yel', '\u26fd Memakai Solar'], tidak: ['', '\ud83d\udeab Tidak Memakai Solar'], belum: ['', '\u2754 Belum Dicek'] };
function ckMsg(e){

  return /Aksi tidak dikenal/.test(m) ? 'Code.gs di Google belum versi terbaru, jadi Cek Solar belum tersedia. Tempel Code.gs yang baru, lalu Terapkan \u2192 Kelola penerapan \u2192 Versi baru.' : m;
}

    <form id="ckf" class="ckbar" autocomplete="off"><input class="inp" id="ckq" type="search" enterkeyhint="search" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="80" aria-label="Cari perusahaan" placeholder="Nama perusahaan / no. telepon" value="${esc(C.q)}"><button class="btn btn-blue" type="submit">\ud83d\udd0d Cari</button></form>

async function ckRun(offset){
  const C = ckState(), qi = $('#ckq'), ti = $('#ckt'), host = $('#ckres'); if (!host) return;
  if (qi) C.q = qi.value;
  if (ti) C.tele = ti.value;
  const more = offset > 0, seq = ++C.seq;
  if (!more) host.innerHTML = '<div class="notice">Mencari\u2026</div>';
  try {
    const d = await call('cekData', { q: C.q, solar: C.solar, tele: C.tele, offset: offset });
    if (seq !== C.seq || !$('#ckres')) return;
    C.d = d; C.rows = more ? C.rows.concat(d.rows) : d.rows.slice(); C.err = '';
  } catch (e) {
    if (seq !== C.seq || !$('#ckres')) return;
    C.err = ckMsg(e); if (!more) { C.d = null; C.rows = []; }
    if (/Telemarketing tidak ditemukan/.test(C.err)) C.tele = '';

  ckDraw();
}
function ckCard(x){
  const b = CK_SC[x.sc] || CK_SC.belum, pills = [];
  pills.push(x.src === 'center' ? '<span class="badge">\ud83d\uddc2\ufe0f Database Center \u00b7 belum dibagikan</span>' : '<span class="badge">\ud83d\udc64 ' + esc(x.tele) + '</span>');
  if (x.src === 'tele') pills.push(badgeOf(x.status));
  if (x.penaw) pills.push(x.penaw === PW[0] ? '<span class="badge bd-blue">\u2705 Penawaran dilakukan</span>' : '<span class="badge">\u2716 Tanpa penawaran</span>');
  const L = [];
  if (x.kota || x.alamat) L.push('\ud83d\udccd ' + esc(x.kota) + (x.kota && x.alamat ? ' \u00b7 ' : '') + esc(x.alamat));
  if (x.telp) L.push('\ud83d\udcde ' + esc(x.telp));
  if (x.act) L.push('\ud83d\udd52 Terakhir dikerjakan: ' + esc(fuText(x.act)));
  if (x.sc === 'belum') L.push(x.src === 'center' ? 'Belum dibagikan ke telemarketing, jadi belum pernah ditanyakan soal solar.' : x.status === ST[2] ? 'Sudah terhubung, tetapi pemakaian solar belum diisi telemarketing.' : 'Belum ditanyakan: perusahaan ini belum berhasil dihubungi.');
  return `<div class="card ckc ck-${esc(x.sc)}"><h3>${esc(x.nama)}</h3><div class="ckst"><span class="badge ${b[0]}">${b[1]}</span></div><div class="pills">${pills.join('')}</div><p class="det" style="margin:0">${L.join('<br>')}</p></div>`;
}
function ckDraw(){
  const C = ckState(), d = C.d, host = $('#ckres'), f = $('#ckflt'); if (!host) return;
  if (!d) { host.innerHTML = '<div class="warnbox">' + esc(C.err || 'Cek Solar belum bisa dimuat.') + '</div><button class="btn btn-pink block" style="margin-top:14px" data-act="ckgo">\u27f3 Coba Lagi</button>'; if (f) f.innerHTML = ''; return; }
  const cn = d.cnt, chip = (k, lbl, n) => `<button type="button" class="dchip${C.solar === k ? ' on' : ''}" data-act="cksl" data-s="${k}">${lbl} <b>${n}</b></button>`;
  if (f) {
    f.innerHTML = `<div class="dchips">${chip('', 'Semua', cn.all) + chip('ya', '\u26fd Memakai', cn.ya) + chip('tidak', '\ud83d\udeab Tidak Memakai', cn.tidak) + chip('belum', '\u2754 Belum Dicek', cn.belum)}</div>
      <label class="lb" for="ckt" style="margin:12px 0 6px">Telemarketing</label><select class="inp" id="ckt"><option value="">Semua (termasuk Database Center)</option>${d.teles.map(n => `<option${n === C.tele ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
    const ti = $('#ckt'); if (ti) ti.onchange = () => ckRun(0);
  }
  const shown = C.rows.length;
  const info = d.total ? 'Menampilkan <b>' + shown + '</b> dari <b>' + d.total + '</b> hasil' + (C.q ? ' untuk \u201c<b>' + esc(C.q) + '</b>\u201d' : '') : '';
  const empty = '<div class="panel" style="text-align:center;font-weight:800">Tidak ditemukan.<div class="sub" style="margin:6px 0 0;font-weight:600">Coba kata yang lebih pendek atau ejaan lain. Perusahaan yang belum ada di database tidak akan muncul.</div></div>';
  host.innerHTML = (info ? '<div class="ckinfo">' + info + '</div>' : '') + (shown ? '<div class="cards">' + C.rows.map(ckCard).join('') + '</div>' : empty)
    + (d.more ? `<button class="btn btn-light block" style="margin-top:14px" data-act="ckmore">Tampilkan lebih banyak (${d.total - shown} lagi)</button>` : '')
    + (C.err ? '<div class="warnbox" style="margin-top:12px">' + esc(C.err) + '</div>' : '')
    + '<p class="sub" style="margin-top:16px">Status solar diisi telemarketing setelah menelepon dan hanya untuk perusahaan yang berhasil terhubung. \u201cBelum Dicek\u201d berarti belum ditanyakan. Catatan telemarketing tidak ditampilkan di akun ini.</p>';
}
ACT.ckgo = () => ckRun(0);
ACT.cksl = el => { ckState().solar = el.dataset.s || ''; ckRun(0); };
ACT.ckmore = () => ckRun(ckState().rows.length);
ACT.addpnt = () => modal(`<h2>Admin Pemantau Baru</h2><p class="sub">Akun ini hanya bisa <b>melihat</b> performa telemarketing dan memeriksa data perusahaan memakai solar atau tidak. Tidak bisa mengubah data dan <b>tidak melihat catatan</b> telemarketing.</p>
  <label class="lb">Nama (tampil di aplikasi)</label><input class="inp" id="pn1" placeholder="contoh: Bu Rina">
  <label class="lb">Nama pengguna (huruf kecil)</label><input class="inp" id="pn2" autocapitalize="none" placeholder="contoh: rina">
  <label class="lb">Kata sandi awal (minimal 6)</label><input class="inp" id="pn3" type="text">
  <div class="two"><button class="btn btn-light" data-act="mclose">Batal</button><button class="btn btn-blue" data-act="addpntgo">Buat</button></div>`);
ACT.addpntgo = async () => {
  try { await call('addPantau', { nama: $('#pn1').value, username: $('#pn2').value, password: $('#pn3').value }); mclose(); toast('\u2714 Akun Admin Pemantau dibuat'); vUsers($('#view')); }
  catch (e) { toast(/Aksi tidak dikenal/.test(String(e.message)) ? 'Code.gs di Google belum versi terbaru. Tempel Code.gs yang baru, lalu Terapkan \u2192 Kelola penerapan \u2192 Versi baru.' : e.message, 'err'); }
};

/* ===================== MULAI ===================== */
function tanpaSinyal(msg){
  showLogin(msg);
  const e = document.getElementById('lerr'); if (!e) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-light block'; b.id = 'lagi'; b.style.marginTop = '12px'; b.textContent = '\ud83d\udd04 COBA LAGI';
  b.onclick = () => { b.disabled = true; b.textContent = 'MENYAMBUNG\u2026'; masuk(); };
  e.parentNode.insertBefore(b, e.nextSibling);
}
function masuk(){
  const s = loadStore();
  if (!(s && s.token)) { showLogin(); return; }
  S.token = s.token;
  let selesai = false;
  /* bila server Google lambat menjawab, jangan biarkan layar menunggu terus: tampilkan halaman masuk */
  const jaga = setTimeout(() => { if (selesai) return; selesai = true; S.token = null; tanpaSinyal('Server belum menjawab. Periksa sinyal internet, lalu ketuk COBA LAGI.'); }, 15000);
  call('me', {}, { quiet: true, silent: true }).then(d => {
    if (selesai) return; selesai = true; clearTimeout(jaga);
    try { S.user = d.user; showApp(); }
    catch (e) { S.token = null; S.user = null; store(null); showLogin('Gagal membuka halaman: ' + e.message); }
  }).catch(er => { if (selesai) return; selesai = true; clearTimeout(jaga); S.token = null; if (er && er.code === 'AUTH') { store(null); showLogin(); } else tanpaSinyal(er && /^Tidak bisa menghubungi/.test(er.message || '') ? 'Belum tersambung ke server. Periksa sinyal internet, lalu ketuk COBA LAGI.' : String((er && er.message) || 'Belum tersambung ke server.')); });
}
themeApply();
try { masuk(); } catch (e) { showLogin('Gagal memulai: ' + e.message); }
var PENANDA_AKHIR = 'CLR-AKHIR-v9';
})();
</script>
